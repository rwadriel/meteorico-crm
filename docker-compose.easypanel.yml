services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - meteorico_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.easypanel
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c "pnpm --filter @meteorico/database exec prisma migrate deploy
      && pnpm --filter @meteorico/database exec prisma db seed
      && node apps/api/dist/server.js"
    environment:
      NODE_ENV: production
      DEPLOYMENT_ENV: production
      API_PORT: "4080"
      API_HOST: 0.0.0.0
      API_CORS_ORIGINS: ${CRM_PUBLIC_URL},https://meteorico.musicalucrativa.com.br,https://zapgrupos-meteorico-crm.gq2dju.easypanel.host
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      WHATSAPP_PRIVATE_PROVIDER: ${WHATSAPP_PRIVATE_PROVIDER:-mock}
      WHATSAPP_OUTBOUND_ENABLED: ${WHATSAPP_OUTBOUND_ENABLED:-false}
      WHATSAPP_STAGING_ALLOWLIST: ${WHATSAPP_STAGING_ALLOWLIST:-}
      META_WHATSAPP_ACCESS_TOKEN: ${META_WHATSAPP_ACCESS_TOKEN:-}
      META_WHATSAPP_PHONE_NUMBER_ID: ${META_WHATSAPP_PHONE_NUMBER_ID:-}
      META_WHATSAPP_WABA_ID: ${META_WHATSAPP_WABA_ID:-}
      META_WHATSAPP_VERIFY_TOKEN: ${META_WHATSAPP_VERIFY_TOKEN:-}
      META_WHATSAPP_REGISTRATION_PIN: ${META_WHATSAPP_REGISTRATION_PIN:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_APP_ID: ${META_APP_ID:-2332788004133267}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v25.0}
      META_APPROVED_TEMPLATE_NAMES: ${META_APPROVED_TEMPLATE_NAMES:-}
      N8N_INTERNAL_TOKEN: ${N8N_INTERNAL_TOKEN}
      N8N_CAMPAIGN_WEBHOOK_URL: http://n8n:5678/webhook/meteorico-campaign
      N8N_STATUS_WEBHOOK_URL: http://n8n:5678/webhook/meteorico-status
      N8N_INBOUND_WEBHOOK_URL: http://n8n:5678/webhook/meteorico-inbound
      TRACKING_BASE_URL: ${TRACKING_BASE_URL:-https://meteorico.musicalucrativa.com.br}
      TRACKING_LINK_BASE_URL: ${TRACKING_LINK_BASE_URL:-https://musicalucrativa.com.br/r}
      TZ: America/Belem
    expose:
      - "4080"

  web:
    build:
      context: .
      dockerfile: Dockerfile.easypanel
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
        restart: true
    environment:
      API_PROXY_HOST: api
    expose:
      - "8080"

  n8n:
    build:
      context: .
      dockerfile: n8n/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_PUBLIC_HOST}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_PUBLIC_HOST}/
      N8N_EDITOR_BASE_URL: https://${N8N_PUBLIC_HOST}/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      METEORICO_API_INTERNAL_URL: http://api:4080
      N8N_INTERNAL_TOKEN: ${N8N_INTERNAL_TOKEN}
      GENERIC_TIMEZONE: America/Belem
      TZ: America/Belem
    volumes:
      - meteorico_n8n_data:/home/node/.n8n
    expose:
      - "5678"

volumes:
  meteorico_postgres_data:
  meteorico_n8n_data:
